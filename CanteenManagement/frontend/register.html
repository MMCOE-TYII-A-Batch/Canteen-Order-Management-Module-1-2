<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account | Campus Canteen Management System</title>
  
  <!-- Bootstrap 5 & Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- NAVBAR SECTION -->
  <nav class="navbar navbar-expand-lg canteen-navbar navbar-dark">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <i class="bi bi-cup-hot-fill me-2 fs-3 text-warning"></i>
        <span>Campus Canteen</span>
      </a>
      <div class="ms-auto">
        <a href="login.html" class="btn btn-canteen-secondary btn-sm">Back to Login</a>
      </div>
    </div>
  </nav>

  <!-- MAIN REGISTRATION FORM SECTION -->
  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-7">
        
        <div class="card custom-card p-4">
          <div class="text-center mb-4">
            <i class="bi bi-person-plus display-4 text-warning"></i>
            <h3 class="fw-bold mt-2">Create New Account</h3>
            <p class="text-secondary small">Register to order food and access canteen management services</p>
          </div>

          <!-- REGISTRATION FORM -->
          <form id="registerForm">
            <div class="row g-3">

              <!-- Full Name Field -->
              <div class="col-md-6">
                <label for="regName" class="form-label fw-semibold">Full Name</label>
                <input type="text" class="form-control" id="regName" placeholder="e.g. Rahul Sharma" required>
              </div>

              <!-- Email Field -->
              <div class="col-md-6">
                <label for="regEmail" class="form-label fw-semibold">Email Address</label>
                <input type="email" class="form-control" id="regEmail" placeholder="e.g. rahul@college.edu" required>
              </div>

              <!-- Phone Number Field -->
              <div class="col-md-6">
                <label for="regPhone" class="form-label fw-semibold">Phone Number</label>
                <input type="tel" class="form-control" id="regPhone" placeholder="e.g. 9876543210" required>
              </div>

              <!-- Student / Employee ID Field -->
              <div class="col-md-6">
                <label for="regIdNumber" class="form-label fw-semibold">Student ID / Employee ID</label>
                <input type="text" class="form-control" id="regIdNumber" placeholder="e.g. CS-2024-042" required>
              </div>

              <!-- Department Field -->
              <div class="col-md-6">
                <label for="regDepartment" class="form-label fw-semibold">Department</label>
                <input type="text" class="form-control" id="regDepartment" placeholder="e.g. Computer Engineering" required>
              </div>

              <!-- Role Selector (STRICT: Student, Manager, Staff) -->
              <div class="col-md-6">
                <label for="regRole" class="form-label fw-semibold">Account Role</label>
                <select class="form-select" id="regRole" required>
                  <option value="" selected disabled>-- Select Role --</option>
                  <option value="Student">Student</option>
                  <option value="Manager">Manager</option>
                  <option value="Staff">Staff</option>
                </select>
              </div>

              <!-- Password Field -->
              <div class="col-md-6">
                <label for="regPassword" class="form-label fw-semibold">Password</label>
                <input type="password" class="form-control" id="regPassword" placeholder="Create password" required>
              </div>

              <!-- Confirm Password Field -->
              <div class="col-md-6">
                <label for="regConfirmPassword" class="form-label fw-semibold">Confirm Password</label>
                <input type="password" class="form-control" id="regConfirmPassword" placeholder="Re-enter password" required>
              </div>

            </div>

            <!-- Submit Register Button -->
            <button type="submit" class="btn btn-canteen-primary w-100 py-2 mt-4 fs-6">
              <i class="bi bi-check-circle me-1"></i> Register Account
            </button>
          </form>

          <hr class="my-4">
          <div class="text-center small text-secondary">
            Already registered? <a href="login.html" class="fw-bold text-dark">Click here to Login</a>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="canteen-footer">
    <div class="container text-center small text-secondary">
      &copy; 2026 Campus Canteen Management System. All rights reserved.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/register.js"></script>
</body>
</html>
