<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout - Campus Canteen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg canteen-navbar navbar-dark">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
          <i class="bi bi-cup-hot-fill me-2 fs-3 text-warning"></i>
          <span>Campus Canteen</span>
        </a>
      </div>
    </nav>

    <main class="container my-5">
      <div class="row">
        <div class="col-md-6">
          <div class="card p-4">
            <h4>Order Summary</h4>
            <div id="orderSummary" class="my-3">
              <!-- dynamically populated -->
            </div>
            <div class="mb-3">
              <label class="form-label">Payment Method</label>
              <select id="paymentMethod" class="form-select">
                <option value="UPI">UPI</option>
                <option value="Card">Card</option>
                <option value="Wallet">Wallet</option>
                <option value="Cash">Cash (Offline)</option>
                <option value="CampusCard">Campus Card</option>
              </select>
            </div>
            <div class="d-grid gap-2">
              <button id="payBtn" class="btn btn-canteen-primary">Proceed to Pay</button>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card p-4" id="receiptCard" style="display:none">
            <h4>Receipt</h4>
            <pre id="receiptContent" class="small"></pre>
            <div class="d-flex gap-2">
              <button id="downloadInvoice" class="btn btn-outline-primary btn-sm">Download Invoice</button>
              <button id="closeReceipt" class="btn btn-secondary btn-sm">Close</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/payments.js"></script>
  </body>
</html>
