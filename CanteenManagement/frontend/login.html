<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Campus Canteen Management System</title>
  
  <!-- Bootstrap 5 & Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- NAVBAR SECTION -->
  <nav class="navbar navbar-expand-lg canteen-navbar navbar-dark">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <i class="bi bi-cup-hot-fill me-2 fs-3 text-warning"></i>
        <span>Campus Canteen</span>
      </a>
      <div class="ms-auto">
        <a href="register.html" class="btn btn-canteen-primary btn-sm">Register Account</a>
      </div>
    </div>
  </nav>

  <!-- MAIN LOGIN FORM SECTION -->
  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        
        <div class="card custom-card p-4">
          <div class="text-center mb-4">
            <i class="bi bi-person-circle display-4 text-warning"></i>
            <h3 class="fw-bold mt-2">Canteen Login</h3>
            <p class="text-secondary small">Access your Student, Staff, or Manager Dashboard</p>
          </div>

          <!-- LOGIN FORM -->
          <form id="loginForm">
            <!-- Email Input -->
            <div class="mb-3">
              <label for="loginEmail" class="form-label fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="loginEmail" placeholder="e.g. student@college.edu" required>
              </div>
            </div>

            <!-- Password Input -->
            <div class="mb-3">
              <label for="loginPassword" class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="loginPassword" placeholder="Enter password" required>
              </div>
            </div>

            <!-- Role Dropdown Selector (STRICT: Student, Manager, Staff) -->
            <div class="mb-3">
              <label for="loginRole" class="form-label fw-semibold">Select Role</label>
              <select class="form-select" id="loginRole" required>
                <option value="" selected disabled>-- Choose Role --</option>
                <option value="Student">Student</option>
                <option value="Manager">Manager</option>
                <option value="Staff">Staff</option>
              </select>
            </div>

            <!-- Remember Me & Forgot Password Row -->
            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-input-label small text-secondary" for="rememberMe">Remember Me</label>
              </div>
              <a href="#" class="small text-decoration-none text-warning fw-semibold" onclick="alert('Forgot password reset link sent to your registered email!')">Forgot Password?</a>
            </div>

            <!-- Login Submit Button -->
            <button type="submit" class="btn btn-canteen-primary w-100 py-2 fs-6">
              <i class="bi bi-box-arrow-in-right me-1"></i> Login to Dashboard
            </button>
          </form>

          <hr class="my-4">
          <div class="text-center small text-secondary">
            Don't have an account yet? <a href="register.html" class="fw-bold text-dark">Register here</a>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="canteen-footer">
    <div class="container text-center small text-secondary">
      &copy; 2026 Campus Canteen Management System. All rights reserved.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
