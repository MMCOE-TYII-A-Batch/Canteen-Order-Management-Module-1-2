<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Campus Canteen Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg canteen-navbar navbar-dark">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <i class="bi bi-cup-hot-fill me-2 fs-3 text-warning"></i>
        <span>Campus Canteen</span>
      </a>
      <div class="ms-auto">
        <a href="login.html" class="btn btn-canteen-primary btn-sm">Back to Login</a>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card custom-card p-4">
          <div class="text-center mb-4">
            <i class="bi bi-lock-fill display-4 text-warning"></i>
            <h3 class="fw-bold mt-2">Reset Your Password</h3>
            <p class="text-secondary small">Enter your registered email and choose a new password.</p>
          </div>

          <form id="forgotPasswordForm">
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">Registered Email</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" placeholder="name@college.edu" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="newPassword" class="form-label fw-semibold">New Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                <input type="password" class="form-control" id="newPassword" placeholder="Enter new password" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-key"></i></span>
                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm new password" required>
              </div>
            </div>

            <button type="submit" class="btn btn-canteen-primary w-100 py-2 fs-6">
              <i class="bi bi-arrow-repeat me-1"></i> Reset Password
            </button>
          </form>

          <div class="text-center mt-4 small text-secondary">
            Remembered your password? <a href="login.html" class="fw-bold text-dark">Sign in</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="canteen-footer">
    <div class="container text-center small text-secondary">
      &copy; 2026 Campus Canteen Management System. All rights reserved.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/forgot-password.js"></script>
</body>
</html>
