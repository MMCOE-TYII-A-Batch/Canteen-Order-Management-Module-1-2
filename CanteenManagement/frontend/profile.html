<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile | Campus Canteen System</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg canteen-navbar navbar-dark">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <i class="bi bi-cup-hot-fill me-2 fs-3 text-warning"></i>
        <span>Campus Canteen</span>
      </a>

      <div class="collapse navbar-collapse" id="profileNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <!-- <li class="nav-item"><a class="nav-link" href="student-dashboard.html">Dashboard</a></li> -->
       
          <li class="nav-item"><a class="nav-link active" href="profile.html">My Profile</a></li>
             <li class="nav-item"><a class="nav-link" href="menu.html">View Menu</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- MAIN PROFILE CONTENT -->
  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        
        <div class="card custom-card p-4">
          <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
            <i class="bi bi-person-bounding-box display-4 text-warning"></i>
            <div>
              <h3 id="profileUserName" class="fw-bold mb-1">Rahul Sharma</h3>
              <p class="text-secondary mb-0"><span id="profileUserRole" class="badge bg-primary">Student Account</span> | <span id="profileUserDepartment">Department of Computer Engineering</span></p>
            </div>
          </div>

          <!-- PROFILE EDIT FORM -->
          <form id="profileForm" class="needs-validation" novalidate>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Full Name</label>
                <input id="profileName" type="text" class="form-control" value="" required readonly>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Email Address</label>
                <input id="profileEmail" type="email" class="form-control" value="" readonly>
                <small class="text-muted">Email cannot be changed directly.</small>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Phone Number</label>
                <input id="profilePhone" type="tel" class="form-control" value="" required readonly>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Student / Employee ID</label>
                <input id="profileCollegeId" type="text" class="form-control" value="" readonly>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Department</label>
                <input id="profileDepartment" type="text" class="form-control" value="" required readonly>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Default Hostel / Block</label>
                <input id="profileLocation" type="text" class="form-control" value="" readonly>
              </div>
            </div>

            <div class="mt-4 d-flex flex-wrap align-items-center gap-2">
              <button id="editProfileBtn" type="button" class="btn btn-outline-primary"><i class="bi bi-pencil-square me-1"></i> Edit</button>
              <button id="saveProfileBtn" type="button" class="btn btn-canteen-primary d-none"><i class="bi bi-save me-1"></i> Save</button>
              <button id="cancelEditBtn" type="button" class="btn btn-outline-secondary d-none">Cancel</button>
              <button id="logoutBtn" type="button" class="btn btn-outline-danger ms-auto"><i class="bi bi-box-arrow-right me-1"></i> Logout</button>
            </div>
          </form>

        </div>

      </div>
    </div>
  </main>

  <footer class="canteen-footer">
    <div class="container text-center small text-secondary">
      &copy; 2026 Campus Canteen Management System. User Profile.

    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
