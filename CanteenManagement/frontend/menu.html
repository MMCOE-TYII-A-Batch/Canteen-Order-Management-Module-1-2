<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canteen Food Menu | Campus Canteen System</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg canteen-navbar navbar-dark">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <i class="bi bi-cup-hot-fill me-2 fs-3 text-warning"></i>
        <span>Campus Canteen</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPageNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menuPageNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="menu.html">Menu</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <a href="menu.html" class="btn btn-outline-warning position-relative me-2">
            <i class="bi bi-cart3"></i> Cart
            <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
          </a>
          <a href="login.html" class="btn btn-canteen-secondary btn-sm">Login</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- MAIN MENU CONTENT -->
  <main class="container my-4">
    
    <div class="text-center mb-4">
      <h2 class="fw-bold text-dark mb-1">Campus Canteen Menu</h2>
      <p class="text-secondary">Fresh, hot meals prepared daily with nutritional hygiene standards</p>
    </div>

    <!-- SEARCH & CATEGORY FILTER BAR -->
    <div class="card custom-card p-3 mb-4">
      <div class="row g-3 align-items-center">
        
        <!-- Live Search Input -->
        <div class="col-md-5">
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-search text-warning"></i></span>
            <input type="text" id="menuSearchInput" class="form-control" placeholder="Search for food items (e.g. Burger, Dosa)...">
          </div>
        </div>

        <!-- Category Filter Buttons -->
        <div class="col-md-7 text-md-end">
          <div class="btn-group flex-wrap" role="group">
            <button type="button" class="btn btn-canteen-primary category-filter-btn" data-category="All" onclick="filterCategory('All')">All Items</button>
            <button type="button" class="btn btn-outline-dark category-filter-btn" data-category="Breakfast" onclick="filterCategory('Breakfast')">Breakfast</button>
            <button type="button" class="btn btn-outline-dark category-filter-btn" data-category="Meals" onclick="filterCategory('Meals')">Meals</button>
            <button type="button" class="btn btn-outline-dark category-filter-btn" data-category="Snacks" onclick="filterCategory('Snacks')">Snacks</button>
            <button type="button" class="btn btn-outline-dark category-filter-btn" data-category="Beverages" onclick="filterCategory('Beverages')">Beverages</button>
          </div>
        </div>

      </div>
    </div>

    <!-- DYNAMIC DISHES GRID CONTAINER -->
    <div class="row" id="menuGridContainer">
      <!-- Dynamically populated by menu.js -->
    </div>

  </main>

  <!-- BOOTSTRAP DISH DETAIL MODAL -->
  <div class="modal fade" id="dishDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title text-warning fw-bold" id="dishModalTitle">Dish Information</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="dishModalBody">
          <!-- Populated by menu.js -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-canteen-primary" data-bs-dismiss="modal" onclick="showNotification('Added item to cart!', 'success')">Order Now</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="canteen-footer">
    <div class="container text-center small text-secondary">
      &copy; 2026 Campus Canteen Management System. Food Menu Page.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/menu.js"></script>
</body>
</html>
