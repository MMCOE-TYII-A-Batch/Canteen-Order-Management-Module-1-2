version: "3.9"

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 2005
      MYSQL_DATABASE: canteen_management
    volumes:
      - ./Database:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"

  tomcat:
    build: .
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/canteen_management?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: 2005
    restart: unless-stopped

volumes:
  mysql-data:
